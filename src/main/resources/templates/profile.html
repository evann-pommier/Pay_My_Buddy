<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Profil - Pay My Buddy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f5f5f5; font-family: sans-serif; }
        .btn-modify {
            background: #F5A623;
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 6px 20px;
            font-size: 0.9rem;
            cursor: pointer;
        }
        .btn-modify:hover { background: #d4891a; }
        .profile-label {
            font-size: 0.9rem;
            color: #555;
            min-width: 110px;
        }
        .profile-value {
            font-size: 0.9rem;
            color: #222;
        }
        .profile-row {
            display: flex;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #f0f0f0;
        }
        .profile-row:last-of-type { border-bottom: none; }
    </style>
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar('profile')}"></div>

<div class="container mt-5 d-flex justify-content-center">
    <div style="width: 100%; max-width: 500px; margin-top: 60px;">

        <!-- Messages flash -->
        <div th:if="${successMessage}"
             class="alert alert-success mb-3"
             role="alert"
             th:text="${successMessage}">
        </div>
        <div th:if="${errorMessage}"
             class="alert alert-danger mb-3"
             role="alert"
             th:text="${errorMessage}">
        </div>

        <!-- Affichage du profil -->
        <div id="view-mode">
            <div class="profile-row">
                <span class="profile-label">Username</span>
                <span class="profile-value" th:text="${user.username}">-</span>
            </div>
            <div class="profile-row">
                <span class="profile-label">Mail</span>
                <span class="profile-value" th:text="${user.email}">-</span>
            </div>
            <div class="profile-row">
                <span class="profile-label">Solde</span>
                <span class="profile-value">
                    <span th:text="${#numbers.formatDecimal(user.balance, 1, 2)}">0.00</span> €
                </span>
            </div>
            <div class="profile-row">
                <span class="profile-label">Mot de passe</span>
                <span class="profile-value">••••••••</span>
            </div>
            <div class="mt-4">
                <button class="btn-modify"
                        onclick="document.getElementById('view-mode').style.display='none';
                                 document.getElementById('edit-mode').style.display='block';"
                        aria-label="Modifier le profil">
                    Modifier
                </button>
            </div>
        </div>

        <!-- Formulaire de modification du profil -->
        <div id="edit-mode" style="display:none;">
            <form th:action="@{/profile}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <div class="profile-row">
                    <label for="username" class="profile-label">Username</label>
                    <input type="text"
                           id="username"
                           name="username"
                           class="form-control"
                           th:value="${user.username}"
                           aria-label="Nom d'utilisateur"
                           required/>
                </div>

                <div class="profile-row">
                    <label for="email" class="profile-label">Mail</label>
                    <input type="email"
                           id="email"
                           name="email"
                           class="form-control"
                           th:value="${user.email}"
                           aria-label="Adresse email"
                           required/>
                </div>

                <div class="profile-row">
                    <label for="newPassword" class="profile-label">Nouveau mot de passe</label>
                    <input type="password"
                           id="newPassword"
                           name="newPassword"
                           class="form-control"
                           placeholder="Laisser vide pour ne pas changer"
                           minlength="8"
                           aria-label="Nouveau mot de passe"/>
                </div>

                <div class="mt-4 d-flex gap-2">
                    <button type="submit" class="btn-modify">Enregistrer</button>
                    <button type="button"
                            class="btn btn-outline-secondary btn-sm"
                            onclick="document.getElementById('view-mode').style.display='block';
                                     document.getElementById('edit-mode').style.display='none';">
                        Annuler
                    </button>
                </div>
            </form>
        </div>

    </div>
</div>

</body>
</html>
