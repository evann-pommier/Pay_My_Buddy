<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Profil - Pay My Buddy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f5f5f5; font-family: sans-serif; }
        .btn-modify {
            background: #F5A623;
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 6px 20px;
            font-size: 0.9rem;
            cursor: pointer;
        }
        .btn-modify:hover { background: #d4891a; }
        .profile-label {
            font-size: 0.9rem;
            color: #555;
            min-width: 110px;
        }
        .profile-value {
            font-size: 0.9rem;
            color: #222;
        }
        .profile-row {
            display: flex;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #f0f0f0;
        }
        .profile-row:last-of-type { border-bottom: none; }
    </style>
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar('profile')}"></div>

<div class="container mt-5 d-flex justify-content-center">
    <div style="width: 100%; max-width: 500px; margin-top: 60px;">

        <div id="alert" class="d-none mb-3"></div>
        <div id="content" style="display:none;">
            <div class="profile-row">
                <span class="profile-label">Username</span>
                <span class="profile-value" id="username">-</span>
            </div>
            <div class="profile-row">
                <span class="profile-label">Mail</span>
                <span class="profile-value" id="email">-</span>
            </div>
            <div class="profile-row">
                <span class="profile-label">Mot de passe</span>
                <span class="profile-value">••••••••</span>
            </div>
            <div class="mt-4">
                <button class="btn-modify" onclick="alert('Fonctionnalité à venir.')">
                    Modifier
                </button>
            </div>
        </div>
    </div>
</div>

<script>
async function loadProfile() {
    const res = await fetch('/api/me');
    if (!res.ok) { window.location.href = '/login'; return; }
    const me = await res.json();
    document.getElementById('username').textContent = me.username;
    document.getElementById('email').textContent = me.email;
    document.getElementById('content').style.display = 'block';
}

loadProfile();
</script>
</body>
</html>
