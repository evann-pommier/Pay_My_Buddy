<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Erreur - Pay My Buddy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f5f5f5; font-family: sans-serif; }
    </style>
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar('')}"></div>

<div class="container mt-5 d-flex justify-content-center">
    <div class="text-center" style="max-width: 500px; margin-top: 80px;">

        <h1 class="display-4 fw-bold text-danger"
            th:text="${errorCode != null ? errorCode : 'Erreur'}">
            Erreur
        </h1>

        <p class="lead mt-3"
           th:text="${errorMessage != null ? errorMessage : 'Une erreur inattendue est survenue.'}">
            Une erreur inattendue est survenue.
        </p>

        <a href="/home" class="btn btn-primary mt-3">Retour à l'accueil</a>
    </div>
</div>

</body>
</html>
