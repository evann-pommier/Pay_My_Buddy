<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Accueil - Pay My Buddy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f5f5f5; font-family: sans-serif; }
        table th { font-weight: 600; font-size: 0.85rem; color: #555; }
        table td { font-size: 0.9rem; }
        .btn-action {
            background: #F5A623;
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 6px 16px;
            font-size: 0.85rem;
            text-decoration: none;
            cursor: pointer;
        }
        .btn-action:hover { background: #d4891a; color: #fff; }
        .btn-action-blue {
            background: #2979FF;
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 6px 16px;
            font-size: 0.85rem;
            text-decoration: none;
        }
        .btn-action-blue:hover { background: #1565C0; color: #fff; }
        .amount-negative { color: #e53935; }
        .amount-positive { color: #2e7d32; }
    </style>
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar('home')}"></div>

<div class="container mt-4" style="max-width: 700px;">

    <!-- Solde et actions -->
    <div class="mb-4 d-flex align-items-center justify-content-between flex-wrap gap-2">
        <div>
            <p class="mb-0 text-muted small">Bonjour,</p>
            <p class="mb-0 fw-semibold" th:text="${user.username}">-</p>
            <p class="mb-0 small">
                Solde :
                <strong>
                    <span th:text="${#numbers.formatDecimal(user.balance, 1, 2)}">0.00</span> €
                </strong>
            </p>
        </div>
        <div class="d-flex gap-2">
            <a href="/transfer" class="btn-action-blue">Envoyer de l'argent</a>
            <a href="/add-connection" class="btn-action">Ajouter une relation</a>
        </div>
    </div>

    <!-- Tableau des transactions -->
    <h6 class="mb-2" style="font-weight:600;">Mes Transactions</h6>
    <table class="table table-borderless" aria-label="Historique des transactions">
        <thead style="border-bottom: 1px solid #ddd;">
            <tr>
                <th scope="col">Relations</th>
                <th scope="col">Description</th>
                <th scope="col" class="text-end">Montant</th>
            </tr>
        </thead>
        <tbody>
            <!-- Cas : aucune transaction -->
            <tr th:if="${#lists.isEmpty(transactions)}">
                <td colspan="3" class="text-center text-muted">Aucune transaction</td>
            </tr>
            <!-- Itération Thymeleaf sur les transactions -->
            <tr th:each="tx : ${transactions}"
                style="border-bottom: 1px solid #f0f0f0;">
                <td>
                    <!-- Affiche l'autre partie de la transaction -->
                    <span th:text="${tx.senderEmail == user.email ? tx.receiverEmail : tx.senderEmail}">-</span>
                </td>
                <td th:text="${tx.description != null ? tx.description : '-'}">-</td>
                <td class="text-end">
                    <span th:if="${tx.senderEmail == user.email}"
                          class="amount-negative"
                          th:text="'-' + ${#numbers.formatDecimal(tx.amount, 1, 2)} + ' €'">
                    </span>
                    <span th:unless="${tx.senderEmail == user.email}"
                          class="amount-positive"
                          th:text="'+' + ${#numbers.formatDecimal(tx.amount, 1, 2)} + ' €'">
                    </span>
                </td>
            </tr>
        </tbody>
    </table>
</div>

</body>
</html>
