<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Accueil - Pay My Buddy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-primary mb-4">
    <div class="container">
        <span class="navbar-brand">💸 Pay My Buddy</span>
        <form th:action="@{/logout}" method="post" class="d-inline">
            <button type="submit" class="btn btn-outline-light btn-sm">
                Se déconnecter
            </button>
        </form>
    </div>
</nav>

<div class="container">

    <!-- Solde -->
    <div class="row mb-4">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h5 class="card-title">Bonjour 👋</h5>
                    <p class="card-text display-6" id="solde">Chargement...</p>
                    <a href="/transfer" class="btn btn-primary me-2">Envoyer de l'argent</a>
                    <a href="/add-connection" class="btn btn-outline-primary">Ajouter un ami</a>
                </div>
            </div>
        </div>
    </div>

    <!-- Historique des transactions -->
    <div class="card shadow-sm">
        <div class="card-header">
            <h5 class="mb-0">Historique des transactions</h5>
        </div>
        <div class="card-body p-0">
            <table class="table table-striped mb-0" aria-label="Historique des transactions">
                <thead>
                    <tr>
                        <th scope="col">Date</th>
                        <th scope="col">Description</th>
                        <th scope="col">Montant</th>
                    </tr>
                </thead>
                <tbody id="transactions">
                    <tr>
                        <td colspan="3" class="text-center text-muted">Chargement...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
// Charge le profil et les transactions via l'API REST
async function loadData() {
    try {
        const [meRes, txRes] = await Promise.all([
            fetch('/api/me'),
            fetch('/api/transactions')
        ]);

        if (!meRes.ok || !txRes.ok) {
            window.location.href = '/login';
            return;
        }

        const me = await meRes.json();
        const transactions = await txRes.json();

        document.getElementById('solde').textContent =
            `${me.username} — Solde : ${me.balance} €`;

        const tbody = document.getElementById('transactions');
        if (transactions.length === 0) {
            tbody.innerHTML = '<tr><td colspan="3" class="text-center text-muted">Aucune transaction</td></tr>';
        } else {
            tbody.innerHTML = transactions.map(tx => `
                <tr>
                    <td>${new Date(tx.createdAt).toLocaleDateString('fr-FR')}</td>
                    <td>${tx.description ?? '-'}</td>
                    <td class="${tx.sender?.email === me.email ? 'text-danger' : 'text-success'}">
                        ${tx.sender?.email === me.email ? '-' : '+'}${tx.amount} €
                    </td>
                </tr>
            `).join('');
        }
    } catch (e) {
        console.error('Erreur chargement données', e);
    }
}

loadData();
</script>
</body>
</html>
