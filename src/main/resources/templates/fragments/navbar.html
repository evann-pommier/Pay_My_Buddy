<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<!--
    Fragment réutilisable : navbar
    Usage : th:replace="~{fragments/navbar :: navbar('transfer')}"
    Valeurs de 'active' : 'transfer', 'profile', 'add-connection'
-->
<head></head>
<body>
<nav th:fragment="navbar(active)"
     style="display:flex; align-items:center; justify-content:space-between;
            padding: 12px 32px; background:#fff; border-bottom: 1px solid #e0e0e0;">

    <span style="font-weight:600; font-size:1rem;">Pay My Buddy</span>

    <div style="display:flex; align-items:center; gap:24px; font-size:0.9rem;">

        <a th:href="@{/transfer}"
           th:style="${active == 'transfer'} ? 'color:#2979FF; font-weight:600; text-decoration:none;'
                                             : 'color:#333; text-decoration:none;'">
            Transférer
        </a>

        <a th:href="@{/profile}"
           th:style="${active == 'profile'} ? 'color:#2979FF; font-weight:600; text-decoration:none;'
                                            : 'color:#333; text-decoration:none;'">
            Profil
        </a>

        <a th:href="@{/add-connection}"
           th:style="${active == 'add-connection'} ? 'color:#2979FF; font-weight:600; text-decoration:none;'
                                                   : 'color:#333; text-decoration:none;'">
            Ajouter relation
        </a>

        <form th:action="@{/logout}" method="post" style="margin:0;">
            <button type="submit"
                    style="background:none; border:none; cursor:pointer;
                           color:#333; font-size:0.9rem; padding:0;">
                Se déconnecter
            </button>
        </form>
    </div>
</nav>
</body>
</html>
