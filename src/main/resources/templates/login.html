<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Connexion - Pay My Buddy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f5f5f5; }
        .logo-btn {
            background: #F5A623;
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 6px 20px;
            font-weight: 600;
            font-size: 1rem;
            display: inline-block;
        }
        .btn-connect {
            background: #2979FF;
            color: #fff;
            border: none;
            width: 100%;
            padding: 8px;
            border-radius: 6px;
            font-size: 0.95rem;
        }
        .btn-connect:hover { background: #1565C0; color: #fff; }
        .form-control { border-radius: 4px; font-size: 0.9rem; }
        .card { border-radius: 8px; border: 1px solid #ddd; }
    </style>
</head>
<body>
<div class="container d-flex justify-content-center align-items-center min-vh-100">
    <div class="card shadow-sm p-4" style="width: 100%; max-width: 340px;">

        <div class="text-center mb-4">
            <span class="logo-btn">Pay My Buddy</span>
        </div>

        <div th:if="${param.error}" class="alert alert-danger py-2 small" role="alert">
            Email ou mot de passe incorrect.
        </div>
        <div th:if="${param.logout}" class="alert alert-success py-2 small" role="alert">
            Vous avez été déconnecté.
        </div>
        <div th:if="${param.registered}" class="alert alert-success py-2 small" role="alert">
            Compte créé ! Connectez-vous.
        </div>

        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label for="email" class="visually-hidden">Adresse email</label>
                <input type="email"
                       id="email"
                       name="email"
                       class="form-control"
                       placeholder="Mail"
                       required
                       autofocus
                       aria-label="Adresse email"/>
            </div>
            <div class="mb-3">
                <label for="password" class="visually-hidden">Mot de passe</label>
                <input type="password"
                       id="password"
                       name="password"
                       class="form-control"
                       placeholder="Mot de passe"
                       required
                       aria-label="Mot de passe"/>
            </div>
            <button type="submit" class="btn-connect">Se connecter</button>
        </form>

        <p class="text-center mt-3 small mb-0">
            Pas encore de compte ?
            <a th:href="@{/register}">S'inscrire</a>
        </p>
    </div>
</div>
</body>
</html>
