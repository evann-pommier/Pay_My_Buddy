<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Transférer - Pay My Buddy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f5f5f5; font-family: sans-serif; }
        .btn-pay {
            background: #2979FF;
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 6px 20px;
            font-size: 0.9rem;
            cursor: pointer;
        }
        .btn-pay:hover { background: #1565C0; }
        .form-control, .form-select { font-size: 0.9rem; border-radius: 4px; }
        table th { font-weight: 600; font-size: 0.85rem; color: #555; }
        table td { font-size: 0.9rem; }
        .amount-negative { color: #e53935; }
        .amount-positive { color: #2e7d32; }
    </style>
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar('transfer')}"></div>

<div class="container mt-4" style="max-width: 700px;">

    <!-- Messages flash -->
    <div th:if="${successMessage}" class="alert alert-success mb-3"
         role="alert" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert-danger mb-3"
         role="alert" th:text="${errorMessage}"></div>

    <!-- Formulaire de virement -->
    <form th:action="@{/transfer}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <div class="d-flex align-items-center gap-2 mb-4 flex-wrap">

            <label for="receiverEmail" class="visually-hidden">Sélectionner une relation</label>
            <select id="receiverEmail" name="receiverEmail"
                    class="form-select" style="max-width:220px;"
                    aria-label="Sélectionner une relation" required>
                <option value="">Sélectionner une relation</option>
                <option th:each="conn : ${connections}"
                        th:value="${conn.email}"
                        th:text="${conn.username + ' (' + conn.email + ')'}">
                </option>
            </select>

            <label for="description" class="visually-hidden">Description</label>
            <input type="text" id="description" name="description"
                   class="form-control" style="max-width:200px;"
                   placeholder="Description"
                   aria-label="Description du virement"/>

            <label for="amount" class="visually-hidden">Montant</label>
            <input type="number" id="amount" name="amount"
                   class="form-control" style="max-width:100px;"
                   step="0.01" min="0.01" placeholder="0 €"
                   aria-label="Montant du virement" required/>

            <button type="submit" class="btn-pay">Payer</button>
        </div>
    </form>

    <!-- Aucun contact -->
    <div th:if="${#lists.isEmpty(connections)}" class="alert alert-info mb-3" role="alert">
        Vous n'avez pas encore de contacts.
        <a href="/add-connection">Ajouter une relation</a>
    </div>

    <!-- Tableau des transactions -->
    <h6 class="mb-2" style="font-weight:600;">Mes Transactions</h6>
    <table class="table table-borderless" aria-label="Historique des transactions">
        <thead style="border-bottom: 1px solid #ddd;">
            <tr>
                <th scope="col">Relations</th>
                <th scope="col">Description</th>
                <th scope="col" class="text-end">Montant</th>
            </tr>
        </thead>
        <tbody>
            <tr th:if="${#lists.isEmpty(transactions)}">
                <td colspan="3" class="text-center text-muted">Aucune transaction</td>
            </tr>
            <tr th:each="tx : ${transactions}"
                style="border-bottom: 1px solid #f0f0f0;">
                <td>
                    <span th:text="${tx.senderEmail == user.email ? tx.receiverEmail : tx.senderEmail}">-</span>
                </td>
                <td th:text="${tx.description != null ? tx.description : '-'}">-</td>
                <td class="text-end">
                    <span th:if="${tx.senderEmail == user.email}"
                          class="amount-negative"
                          th:text="'-' + ${#numbers.formatDecimal(tx.amount, 1, 2)} + ' €'">
                    </span>
                    <span th:unless="${tx.senderEmail == user.email}"
                          class="amount-positive"
                          th:text="'+' + ${#numbers.formatDecimal(tx.amount, 1, 2)} + ' €'">
                    </span>
                </td>
            </tr>
        </tbody>
    </table>
</div>

</body>
</html>
