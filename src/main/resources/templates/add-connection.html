<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ajouter un ami - Pay My Buddy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-primary mb-4">
    <div class="container">
        <a class="navbar-brand" href="/home">💸 Pay My Buddy</a>
        <form th:action="@{/logout}" method="post" class="d-inline">
            <button type="submit" class="btn btn-outline-light btn-sm">
                Se déconnecter
            </button>
        </form>
    </div>
</nav>

<div class="container" style="max-width: 500px;">
    <div class="card shadow-sm">
        <div class="card-header">
            <h5 class="mb-0">Ajouter un ami</h5>
        </div>
        <div class="card-body">
            <div id="alert" class="d-none"></div>

            <div class="mb-3">
                <label for="friendEmail" class="form-label">Email de votre ami</label>
                <input type="email" id="friendEmail" class="form-control"
                       placeholder="ami@email.com" required
                       aria-label="Email de l'ami à ajouter"/>
            </div>
            <button onclick="addFriend()" class="btn btn-primary w-100">
                Ajouter
            </button>
        </div>
    </div>
</div>

<script>
async function addFriend() {
    const friendEmail = document.getElementById('friendEmail').value;
    const alertDiv = document.getElementById('alert');

    const res = await fetch('/api/connections', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json',
                   'X-XSRF-TOKEN': getCsrf() },
        body: JSON.stringify({ friendEmail })
    });

    alertDiv.classList.remove('d-none', 'alert-success', 'alert-danger');
    if (res.ok) {
        alertDiv.className = 'alert alert-success';
        alertDiv.textContent = 'Ami ajouté avec succès !';
        document.getElementById('friendEmail').value = '';
    } else {
        alertDiv.className = 'alert alert-danger';
        alertDiv.textContent = 'Erreur : utilisateur introuvable ou déjà ajouté.';
    }
}

function getCsrf() {
    return document.cookie.split(';')
        .find(c => c.trim().startsWith('XSRF-TOKEN='))
        ?.split('=')[1] ?? '';
}
</script>
</body>
</html>
