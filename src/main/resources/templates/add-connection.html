<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ajouter une relation - Pay My Buddy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f5f5f5; font-family: sans-serif; }
        .btn-add {
            background: #F5A623;
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 6px 20px;
            font-size: 0.9rem;
            cursor: pointer;
            white-space: nowrap;
        }
        .btn-add:hover { background: #d4891a; }
        .form-control { font-size: 0.9rem; border-radius: 4px; }
    </style>
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar('add-connection')}"></div>

<div class="container mt-5" style="max-width: 700px;">

    <!-- Messages flash -->
    <div th:if="${successMessage}" class="alert alert-success mb-3"
         role="alert" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert-danger mb-3"
         role="alert" th:text="${errorMessage}"></div>

    <div class="d-flex flex-column align-items-center" style="gap: 12px; margin-top: 80px;">

        <p style="font-weight:600; font-size:0.95rem; margin-bottom:4px;">
            Chercher une relation
        </p>

        <form th:action="@{/add-connection}" method="post"
              class="d-flex align-items-center gap-2">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <label for="friendEmail" class="visually-hidden">Email de la relation à ajouter</label>
            <input type="email"
                   id="friendEmail"
                   name="friendEmail"
                   class="form-control"
                   style="width: 260px;"
                   placeholder="Saisir une adresse mail"
                   aria-label="Email de la relation à ajouter"
                   required/>

            <button type="submit" class="btn-add">Ajouter</button>
        </form>
    </div>
</div>

</body>
</html>
