<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ajouter une relation - Pay My Buddy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <style>
        body { background: #f5f5f5; font-family: sans-serif; }
        .btn-add {
            background: #F5A623;
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 6px 20px;
            font-size: 0.9rem;
            cursor: pointer;
            white-space: nowrap;
        }
        .btn-add:hover { background: #d4891a; }
        .form-control { font-size: 0.9rem; border-radius: 4px; }
    </style>
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar('add-connection')}"></div>

<div class="container mt-5" style="max-width: 700px;">

    <div id="alert" class="d-none mb-3"></div>

    <div class="d-flex flex-column align-items-center" style="gap: 12px; margin-top: 80px;">
        <p style="font-weight:600; font-size:0.95rem; margin-bottom:4px;">
            Chercher une relation
        </p>
        <div class="d-flex align-items-center gap-2">
            <input type="email" id="friendEmail" class="form-control" style="width: 260px;"
                   placeholder="Saisir une adresse mail"
                   aria-label="Email de la relation à ajouter"/>
            <button onclick="addFriend()" class="btn-add">Ajouter</button>
        </div>
    </div>
</div>

<script>
async function addFriend() {
    const friendEmail = document.getElementById('friendEmail').value;
    const alertDiv = document.getElementById('alert');

    const res = await fetch('/api/connections', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            [getCsrfHeader()]: getCsrf()
        },
        body: JSON.stringify({ friendEmail })
    });

    alertDiv.classList.remove('d-none', 'alert-success', 'alert-danger');
    if (res.ok) {
        alertDiv.className = 'alert alert-success';
        alertDiv.textContent = 'Relation ajoutée avec succès !';
        document.getElementById('friendEmail').value = '';
    } else {
        const error = await res.json().catch(() => ({}));
        alertDiv.className = 'alert alert-danger';
        alertDiv.textContent = error.message ?? 'Utilisateur introuvable ou déjà ajouté.';
    }
}

function getCsrf() {
    return document.querySelector('meta[name="_csrf"]').content;
}
function getCsrfHeader() {
    return document.querySelector('meta[name="_csrf_header"]').content;
}
</script>
</body>
</html>
