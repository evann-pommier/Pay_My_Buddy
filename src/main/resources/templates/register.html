<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Inscription - Pay My Buddy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f5f5f5; }
        .logo-btn {
            background: #F5A623;
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 6px 20px;
            font-weight: 600;
            font-size: 1rem;
            display: inline-block;
        }
        .btn-register {
            background: #2979FF;
            color: #fff;
            border: none;
            width: 100%;
            padding: 8px;
            border-radius: 6px;
            font-size: 0.95rem;
        }
        .btn-register:hover { background: #1565C0; color: #fff; }
        .form-control { border-radius: 4px; font-size: 0.9rem; }
        .card { border-radius: 8px; border: 1px solid #ddd; }
    </style>
</head>
<body>
<div class="container d-flex justify-content-center align-items-center min-vh-100">
    <div class="card shadow-sm p-4" style="width: 100%; max-width: 340px;">

        <div class="text-center mb-4">
            <span class="logo-btn">Pay My Buddy</span>
        </div>

        <!-- Erreur métier (email/username déjà pris) -->
        <div th:if="${errorMessage}"
             class="alert alert-danger py-2 small"
             role="alert"
             th:text="${errorMessage}">
        </div>

        <form th:action="@{/register}" th:object="${registerDTO}" method="post"
              novalidate>
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
			
			<div th:if="${#fields.hasErrors('*')}"
			             class="alert alert-danger py-2 small"
			             role="alert">
			            <ul class="mb-0 ps-3">
			                <li th:each="err : ${#fields.errors('*')}" th:text="${err}"></li>
			            </ul>
			        </div>

            <div class="mb-3">
                <label for="username" class="visually-hidden">Nom d'utilisateur</label>
                <input type="text"
                       id="username"
                       th:field="*{username}"
                       class="form-control"
                       th:classappend="${#fields.hasErrors('username')} ? 'is-invalid'"
                       placeholder="Username"
                       required
                       aria-label="Nom d'utilisateur"/>
                <div class="invalid-feedback" th:errors="*{username}"></div>
            </div>

            <div class="mb-3">
                <label for="email" class="visually-hidden">Adresse email</label>
                <input type="email"
                       id="email"
                       th:field="*{email}"
                       class="form-control"
                       th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"
                       placeholder="Mail"
                       required
                       aria-label="Adresse email"/>
                <div class="invalid-feedback" th:errors="*{email}"></div>
            </div>

            <div class="mb-3">
                <label for="password" class="visually-hidden">Mot de passe</label>
                <input type="password"
                       id="password"
                       th:field="*{password}"
                       class="form-control"
                       th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'"
                       placeholder="Mot de passe"
                       required
                       minlength="8"
                       aria-label="Mot de passe"/>
                <div class="invalid-feedback" th:errors="*{password}"></div>
            </div>

            <button type="submit" class="btn-register">S'inscrire</button>
        </form>

        <p class="text-center mt-3 small mb-0">
            Déjà un compte ?
            <a th:href="@{/login}">Se connecter</a>
        </p>
    </div>
</div>
</body>
</html>
