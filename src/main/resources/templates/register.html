<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Inscription - Pay My Buddy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <style>
        body { background: #f5f5f5; }
        .logo-btn {
            background: #F5A623;
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 6px 20px;
            font-weight: 600;
            font-size: 1rem;
            display: inline-block;
        }
        .btn-register {
            background: #2979FF;
            color: #fff;
            border: none;
            width: 100%;
            padding: 8px;
            border-radius: 6px;
            font-size: 0.95rem;
        }
        .btn-register:hover { background: #1565C0; color: #fff; }
        .form-control { border-radius: 4px; font-size: 0.9rem; }
        .card { border-radius: 8px; border: 1px solid #ddd; }
    </style>
</head>
<body>
<div class="container d-flex justify-content-center align-items-center min-vh-100">
    <div class="card shadow-sm p-4" style="width: 100%; max-width: 340px;">

        <div class="text-center mb-4">
            <span class="logo-btn">Pay My Buddy</span>
        </div>

        <div id="alert" class="d-none mb-3"></div>

        <div class="mb-3">
            <input type="text" id="username" class="form-control"
                   placeholder="Username" required
                   aria-label="Nom d'utilisateur"/>
        </div>
        <div class="mb-3">
            <input type="email" id="email" class="form-control"
                   placeholder="Mail" required
                   aria-label="Adresse email"/>
        </div>
        <div class="mb-3">
            <input type="password" id="password" class="form-control"
                   placeholder="Mot de passe" required minlength="8"
                   aria-label="Mot de passe"/>
        </div>
        <button type="button" onclick="register()" class="btn-register">
            S'inscrire
        </button>

        <p class="text-center mt-3 small mb-0">
            Déjà un compte ?
            <a th:href="@{/login}">Se connecter</a>
        </p>
    </div>
</div>

<script>
async function register() {
    const alertDiv = document.getElementById('alert');
    const res = await fetch('/api/auth/register', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            [getCsrfHeader()]: getCsrf()
        },
        body: JSON.stringify({
            username: document.getElementById('username').value,
            email: document.getElementById('email').value,
            password: document.getElementById('password').value
        })
    });

    alertDiv.classList.remove('d-none', 'alert-success', 'alert-danger');
    if (res.ok) {
        alertDiv.className = 'alert alert-success py-2 small';
        alertDiv.textContent = 'Compte créé ! Redirection...';
        setTimeout(() => window.location.href = '/login?registered', 1500);
    } else {
        const error = await res.json().catch(() => ({}));
        alertDiv.className = 'alert alert-danger py-2 small';
        alertDiv.textContent = error.message ?? 'Cet email est déjà utilisé.';
    }
}

function getCsrf() {
    return document.querySelector('meta[name="_csrf"]').content;
}
function getCsrfHeader() {
    return document.querySelector('meta[name="_csrf_header"]').content;
}
</script>
</body>
</html>
