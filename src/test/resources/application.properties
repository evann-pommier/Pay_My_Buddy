# =============================================================
#  Pay My Buddy - Configuration pour les TESTS uniquement
#  Fichier : src/test/resources/application.properties
#  Utilise une base H2 en mémoire \u2192 pas besoin de MySQL
#  pour faire tourner les tests JUnit/Mockito.
# =============================================================

# Base H2 en mémoire (remplace MySQL pendant les tests)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate recrée les tables à chaque lancement des tests
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Désactive l'init SQL (schema.sql est pour MySQL)
spring.sql.init.mode=never

# Désactive le cache Thymeleaf pendant les tests
spring.thymeleaf.cache=false