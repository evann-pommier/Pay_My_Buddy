# =============================================================
#  Pay My Buddy - Configuration pour les TESTS uniquement
#  Fichier : src/test/resources/application.properties
#  Utilise Testcontainers -> lance un vrai MySQL dans Docker
#  pour faire tourner les tests JUnit.
# =============================================================

# Testcontainers - Lance un vrai conteneur MySQL automatiquement
# La syntaxe jdbc:tc: est interceptée par Testcontainers
spring.datasource.url=jdbc:tc:mysql:8.0:///paymybuddy
spring.datasource.driver-class-name=org.testcontainers.jdbc.ContainerDatabaseDriver
spring.datasource.username=test
spring.datasource.password=test

# Hibernate recrée les tables à chaque lancement des tests
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Exécute le schema.sql pour créer les tables dans le conteneur
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# Désactive le cache Thymeleaf pendant les tests
spring.thymeleaf.cache=false